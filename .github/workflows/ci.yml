name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.allow-failure == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.4'
            allow-failure: false
          - php: '8.5'
            allow-failure: false
          # ClassGenerator's reflection-based codegen is the part of this
          # codebase most likely to break on a new PHP version. Catching
          # that against 8.6 nightlies now is worth the extra job, even
          # this far ahead of 8.6's own release.
          - php: '8.6'
            allow-failure: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-interaction

      - name: Run tests
        run: vendor/bin/phpunit
