<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} · {{SITE_NAME}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<link rel="stylesheet" href="assets/style.css">
</head>
<body class="antialiased">
<input type="checkbox" id="nav-toggle" class="nav-toggle">
<header class="topbar">
  <div class="topbar-inner">
    <a href="index.html" class="wordmark" aria-label="Homepage">Test<span>Double</span></a>
    <label for="nav-toggle" class="menu-btn" aria-label="Toggle navigation">
      <svg class="icon-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5M3.75 17.25h16.5" /></svg>
      <svg class="icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
    </label>
    <nav class="topbar-links" aria-label="External">
      <a class="topbar-link" href="{{REPO_URL}}">GitHub</a>
      <a class="topbar-link" href="{{PACKAGIST_URL}}">Packagist</a>
    </nav>
  </div>
</header>
<div class="shell">
  <aside class="sidebar">
    <nav aria-label="Documentation">
      <p class="sidebar-heading">Documentation</p>
      <ol class="chapter-list" role="list">
{{SIDEBAR_ITEMS}}      </ol>
    </nav>
  </aside>
  <label for="nav-toggle" class="scrim" aria-hidden="true"></label>
  <main class="content">
    <div class="content-inner">
      <article class="prose">
        <p class="page-eyebrow">Chapter {{CHAPTER_NUMBER}} of {{CHAPTER_TOTAL}}</p>
        <h1 class="page-title">{{TITLE}}</h1>
{{BODY}}
      </article>
      <nav class="pager" aria-label="Chapter navigation">{{PAGER}}</nav>
    </div>
  </main>
{{TOC_SECTION}}
</div>
<footer class="site-footer">
  <div class="footer-inner">
    <span>{{SITE_NAME}}</span>
    <span>MIT Licensed</span>
    <a href="{{REPO_URL}}">GitHub</a>
    <a href="{{PACKAGIST_URL}}">Packagist</a>
    <span class="footer-spacer">jasonmccreary/test-double</span>
  </div>
</footer>
</body>
</html>
